[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umd-cs4821-security-ethics"
version = "0.1.0"
description = "Defensive teaching lab for secure design and computing ethics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rudy M" }]
keywords = ["education", "application-security", "ethics", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Security",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
secure-notes = "secure_notes.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["secure_notes"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
no_implicit_reexport = true
